<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>выездной специалист</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">
</head>
<body> 
  <div class="container">
    <header>
      <h1>✉ заявки</h1>
      <div class="status-bar">
        <span id="onlineStatus">🔍 проверка...</span>
        <button id="syncBtn">↺ синхранизировать (0) файлов</button>
      </div>
    </header>

    <div class="filters">
      <select id="priorityFilter">
        <option value="all">все приоритеты</option>
        <option value="высокий">высокий</option>
        <option value="средний">средний</option>
        <option value="низкий">низкий</option>
      </select>
      <button id="addTicketBtn">+ новая заявка</button>
      <button id="clearDraftBtn" class="draft-clear-btn" style="display:none">🗑️ очистить черновик</button>
    </div>

    <div id="ticketsList" class="tickets-list"></div>
  </div>

  <div id="ticketModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle">новая заявка</h2>
      <form id="ticketForm">
        <input type="text" id="title" placeholder="название" required>
        <textarea id="description" placeholder="описание" rows="4"></textarea>
        <select id="priority">
          <option value="высокий">высокий</option>
          <option value="средний" selected>средний</option>
          <option value="низкий">низкий</option>
        </select>
        <button type="submit">сохранить</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>

</body>
</html>
